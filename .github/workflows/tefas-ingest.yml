name: TEFAS Ingest

on:
  workflow_dispatch:
  schedule:
    # Turkey is UTC+3. These match 05:00, 06:00, 07:00, 08:35,
    # 09:35, 10:35, 11:35 TR.
    - cron: "0 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "35 5 * * 1-5"
    - cron: "35 6 * * 1-5"
    - cron: "35 7 * * 1-5"
    - cron: "35 8 * * 1-5"

concurrency:
  group: tefas-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/tefas_ingest/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r workers/tefas_ingest/requirements.txt

      - name: Run TEFAS ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEFAS_REQUEST_INTERVAL_SECONDS: "10"
          TEFAS_LOOKBACK_DAYS: "7"
          TEFAS_SKIP_IF_SUCCESS_WITHIN_MINUTES: "30"
        run: python workers/tefas_ingest/tefas_ingest.py
